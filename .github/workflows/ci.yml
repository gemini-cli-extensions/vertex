name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: ~/.cargo/bin/uv pip install -e .[dev]
    - name: Run Ruff checks
      run: ~/.cargo/bin/uv run ruff check .
    - name: Run Pyright checks
      run: ~/.cargo/bin/uv run pyright
